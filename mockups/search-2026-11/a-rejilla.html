<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Búsqueda · A · Rejilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="search.css">
<style>
  /* A · Rejilla: la carátula y el retrato mandan. Sin campo duplicado: la consulta vive en la cabecera y
     encabeza la página en grande; los tipos son pestañas con icono; los filtros se pliegan. */
  .top { padding: clamp(28px, 4vw, 52px) 0 0; display: flex; flex-direction: column; gap: 22px; }
  .titlerow { display: flex; align-items: end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  h1.q { font-size: clamp(44px, 6vw, 84px); }
  .sub { margin-top: 10px; font: 500 13px var(--data); color: var(--muted); }
  .m-field { display: none; height: 48px; align-items: center; gap: 10px; padding: 0 14px; border: 1px solid var(--border-2); border-radius: 10px; background: var(--surface); }
  .m-field svg { width: 18px; height: 18px; color: var(--muted); }
  .m-field span { font-size: 17px; }
  .ttabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .ttabs a { display: inline-flex; align-items: center; gap: 8px; padding: 12px 14px; margin-bottom: -1px; border-bottom: 2px solid transparent; font-family: var(--display); font-size: 16px; color: var(--muted); white-space: nowrap; }
  .ttabs a svg { width: 17px; height: 17px; }
  .ttabs a[aria-current] { color: var(--paper); border-color: var(--amber); }
  .ttabs .spacer { flex: 1; }
  .ttabs .fbtn { display: inline-flex; align-items: center; gap: 8px; align-self: center; height: 36px; padding: 0 12px; border: 1px solid var(--border-2); border-radius: 8px; font: 500 13px var(--data); color: var(--paper); }
  .ttabs .fbtn svg { width: 15px; height: 15px; }
  .ttabs .fbtn b { color: var(--amber); font-weight: 500; }

  .block { padding-top: clamp(36px, 4.5vw, 60px); }
  .bh { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
  .bh h2 { font-family: var(--display); font-weight: 700; font-size: clamp(22px, 2vw, 28px); letter-spacing: -.015em; }
  .bh p { font-size: 15px; color: var(--muted); margin-top: 4px; }

  /* Artistas */
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 28px 20px; }
  .pcard { display: flex; flex-direction: column; gap: 12px; }
  .pcard .ph { width: 100%; transition: transform .25s cubic-bezier(.16,1,.3,1); }
  .pcard:hover .ph { transform: translateY(-3px); }
  .pcard .ph.ini { font-size: 48px; }
  .pcard h3 { font-family: var(--display); font-size: 17px; font-weight: 500; line-height: 1.2; }
  .pcard .meta { margin-top: 4px; display: block; }
  .pcard .discs { margin-top: 6px; display: block; font: 500 12.5px var(--data); color: var(--paper); }
  .homs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .hom { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; align-items: center; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--ink-2); }
  .hom:hover { border-color: var(--border-2); }
  .hom .ph { width: 52px; font-size: 20px; }
  .hom h3 { font-family: var(--display); font-size: 16px; font-weight: 500; }
  .hom .dis { display: block; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px 24px; }
  .more-grid a { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .more-grid .ph { width: 36px; font-size: 14px; }
  .more-grid b { font-family: var(--display); font-weight: 500; font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .more-grid .meta { font-size: 11.5px; }

  /* Álbumes */
  .agrid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 28px 20px; }
  .feat { grid-column: span 2; grid-row: span 2; display: flex; flex-direction: column; gap: 14px; }
  .feat-main { display: flex; flex-direction: column; gap: 14px; }
  .feat .cvbox { border-radius: 10px; box-shadow: 0 24px 40px -24px rgba(0,0,0,.9); }
  .feat h3 { font-family: var(--display); font-size: clamp(24px, 2.2vw, 32px); font-weight: 700; letter-spacing: -.015em; line-height: 1.1; }
  .feat .by { font-size: 17px; color: var(--paper); margin-top: 4px; }
  .feat .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 8px; }
  .feat .eds { font: 500 12.5px var(--data); color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px; }
  .feat .eds a { color: var(--paper); text-decoration: underline; text-decoration-color: var(--border-2); text-underline-offset: 3px; }
  .acard { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .acard .cvbox, .acard .disc { width: 100%; transition: transform .25s cubic-bezier(.16,1,.3,1); }
  .acard:hover .cvbox, .acard:hover .disc { transform: translateY(-3px); }
  .acard b { font-family: var(--display); font-weight: 500; font-size: 15.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .acard .meta { font-size: 11.5px; }
  .note { font-size: 15px; color: var(--muted); }
  .note b { color: var(--paper); font-weight: 400; }
  .narrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .narrow span { font: 500 12.5px var(--data); color: var(--muted); margin-right: 4px; }

  /* Canciones */
  .song-hero { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(24px, 4vw, 64px); align-items: center; padding: clamp(22px, 3vw, 36px); border: 1px solid var(--border); border-radius: 16px; background: var(--surface); }
  .song-hero h3 { font-family: var(--display); font-weight: 700; font-size: clamp(36px, 4vw, 56px); line-height: 1; letter-spacing: -.025em; }
  .song-hero .by { margin-top: 10px; font-size: 19px; }
  .song-hero .row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin-top: 16px; }
  .song-hero .acts { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .appears { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .appears a { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .appears b { display: block; font-family: var(--display); font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appears .meta, .wallrow .meta { display: block; }
  .appears .meta { font-size: 11px; }
  .appears .more { display: grid; place-items: center; aspect-ratio: 1; border: 1px dashed var(--border-2); border-radius: 6px; font: 500 13px var(--data); color: var(--muted); }
  .sgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .scard { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: 12px; }
  .scard:hover { border-color: var(--border-2); }
  .scard .ph { width: 44px; border-radius: 8px; font-size: 17px; }
  .scard b { font-family: var(--display); font-weight: 500; font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scard .meta { font-size: 11.5px; }

  /* Sin resultados */
  .empty { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: clamp(28px, 5vw, 80px); align-items: center; padding-top: clamp(40px, 6vw, 80px); }
  .empty .bigdisc { width: min(340px, 70%); color: var(--border-2); justify-self: center; }
  .empty .bigdisc svg { width: 100%; height: auto; }
  .empty h2 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 3vw, 44px); letter-spacing: -.02em; line-height: 1.05; }
  .empty h2 q { quotes: "«" "»"; color: var(--muted); font-weight: 500; }
  .empty p { margin-top: 14px; font-size: 18px; color: var(--muted); max-width: 46ch; }
  .tips { margin-top: 22px; display: grid; gap: 10px; }
  .tip { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; font-size: 16px; }
  .tip i { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--amber); font: 500 13px var(--data); font-style: normal; }
  .tip code { font: 500 14px var(--data); color: var(--paper); background: var(--surface-2); padding: 1px 6px; border-radius: 4px; }
  .elsewhere { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .elsewhere > span { font: 500 12.5px var(--data); color: var(--muted); margin-right: 4px; }
  .mean { margin-top: clamp(40px, 5vw, 64px); padding-top: 28px; border-top: 1px solid var(--border); }
  .wallrow { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 14px; }
  .wallrow a { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .wallrow b { display: block; font-family: var(--display); font-weight: 500; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .loadmore { margin-top: 28px; display: flex; justify-content: center; }

  @media (max-width: 1200px) {
    .agrid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .more-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .sgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .wallrow { grid-template-columns: repeat(6, minmax(0, 1fr)); }
    .wallrow a:nth-child(n+7) { display: none; }
  }
  @media (max-width: 900px) {
    .homs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .song-hero, .empty { grid-template-columns: minmax(0, 1fr); }
    .empty .bigdisc { display: none; }
    .sgrid, .more-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 640px) {
    .m-field { display: flex; }
    .titlerow { display: none; }
    .ttabs a { padding: 12px 10px; font-size: 15px; }
    .ttabs a svg { display: none; }
    .ttabs .fbtn span { display: none; }
    .pgrid, .agrid, .homs, .more-grid, .sgrid { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-inline: var(--pad); gap: 14px; margin: 0 calc(-1 * var(--pad)); padding: 0 var(--pad) 6px; scrollbar-width: none; }
    .pcard { flex: 0 0 40%; scroll-snap-align: start; }
    .hom { flex: 0 0 80%; scroll-snap-align: start; }
    .more-grid { flex-direction: column; overflow: visible; margin: 0; padding: 0; }
    .agrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); overflow: visible; margin: 0; padding: 0; gap: 22px 14px; }
    .feat { grid-column: span 2; grid-row: auto; }
    .feat-main { display: grid; grid-template-columns: 132px minmax(0, 1fr); align-items: start; gap: 14px; }
    .feat .row { margin-top: 6px; }

    .appears { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .appears a:nth-child(n+6) { display: none; }
    .sgrid { flex-direction: column; overflow: visible; margin: 0; padding: 0; }
    .wallrow { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .wallrow a:nth-child(n+4) { display: none; }
    .bh { flex-direction: column; align-items: start; gap: 6px; }
  }
</style>
</head>
<body>
<header class="site-header"></header>
<main class="wrap" id="app"></main>
<script src="data.js"></script>
<script src="shared.js"></script>
<script>
  var D = window.SEARCH_DATA, U = window.UI, I = window.ICON;
  var QUERIES = { artist: "pink", album: "the wall", song: "creep", none: "qzxvbnmqk" };
  var TYPES = [["artist", "Artistas"], ["album", "Álbumes"], ["song", "Canciones"], ["user", "Usuarios"]];
  var PF = [["Pink Floyd", "f2026101-945b-3d05-9ef4-aa718fc3feef"]];

  function head(state) {
    var q = QUERIES[state], type = state === "none" ? "album" : state;
    var total = state === "none" ? 0 : D.totals[type];
    var filters = state === "artist" ? "Tipo" : state === "album" ? "Categoría · Década" : "";
    return (
      '<section class="top" aria-labelledby="qh">' +
      '<label class="m-field">' + I.search + "<span>" + U.esc(q) + "</span></label>" +
      '<div class="titlerow"><div><h1 class="q" id="qh"><span class="qm">«</span>' + U.esc(q) + '<span class="qm">»</span></h1>' +
      '<p class="sub">' + (total ? U.countLabel(total) + " " + (type === "artist" ? "artistas" : type === "album" ? "álbumes" : "canciones") + " en MusicBrainz" : "Sin coincidencias") + "</p></div></div>" +
      '<nav class="ttabs" aria-label="Tipo de resultado">' +
      TYPES.map(function (t) { return '<a href="#' + (t[0] === "user" ? "artist" : t[0]) + '"' + (t[0] === type ? ' aria-current="page"' : "") + ">" + I[t[0]] + t[1] + "</a>"; }).join("") +
      '<span class="spacer"></span>' +
      (filters ? '<button class="fbtn">' + I.filter + "<span>Filtros: </span><b>" + filters + "</b></button>" : "") +
      "</nav></section>"
    );
  }

  function artists() {
    var inCat = D.artists.filter(function (a) { return a.inCatalog; });
    var exact = D.artists.filter(function (a) { return a.exact && !a.inCatalog; });
    var rest = D.artists.filter(function (a) { return !a.inCatalog && !a.exact; });
    return (
      '<section class="block" aria-labelledby="b1"><div class="bh"><div><h2 id="b1">Ya en music-platform</h2><p>Artistas con su discografía en el catálogo: suelen ser lo que se busca.</p></div></div>' +
      '<div class="pgrid">' + inCat.map(function (a) {
        return '<a class="pcard" href="#">' + U.portrait(a) + "<div><h3>" + U.esc(a.name) + '</h3><span class="meta">' + U.meta([a.type, a.country, U.years(a)]) + '</span><span class="discs num">' + a.discs + " discos</span></div></a>";
      }).join("") + "</div></section>" +
      '<section class="block" aria-labelledby="b2"><div class="bh"><div><h2 id="b2">Se llaman exactamente «Pink»</h2><p>Seis homónimos: el país y la descripción de MusicBrainz ayudan a elegir.</p></div></div>' +
      '<div class="homs">' + exact.map(function (a) {
        return '<a class="hom" href="#">' + U.portrait(a) + "<div><h3>" + U.esc(a.name) + '</h3><span class="meta">' + U.meta([a.type, a.country, U.years(a)]) + '</span><span class="dis">' + U.esc(a.dis) + "</span></div></a>";
      }).join("") + "</div></section>" +
      '<section class="block" aria-labelledby="b3"><div class="bh"><div><h2 id="b3">Más artistas</h2></div><span class="see">' + D.artists.length + " de " + U.countLabel(D.totals.artist) + "</span></div>" +
      '<div class="more-grid">' + rest.map(function (a) {
        return '<a href="#">' + U.portrait(a) + "<span><b>" + U.esc(a.name) + '</b><span class="meta">' + U.meta([a.type, a.country, U.years(a)]) + "</span></span></a>";
      }).join("") + '</div><div class="loadmore"><button class="btn line">Cargar más</button></div></section>'
    );
  }

  function albums() {
    var first = D.albums[0];
    var pfOther = D.albums.filter(function (a, i) { return i > 0 && a.artist === "Pink Floyd"; });
    var others = D.albums.filter(function (a, i) { return i > 0 && a.artist !== "Pink Floyd"; });
    return (
      '<section class="block" aria-labelledby="b1">' +
      '<p class="note">Más de 1.000 discos se llaman <b>«The Wall»</b>. Acota por artista:</p>' +
      '<div class="narrow">' + D.refine.map(function (n) { return '<a class="chip" href="#">' + U.esc(n) + "</a>"; }).join("") + "</div></section>" +
      '<section class="block" aria-labelledby="b2"><h2 id="b2" class="sr-only">Álbumes</h2><div class="agrid">' +
      // Ficha destacada: un bloque con dos enlaces hermanos (nunca un enlace dentro de otro).
      '<div class="feat"><a href="#" class="feat-main">' + U.cover(first.cover) + "<div><h3>" + U.esc(first.title) + '</h3><p class="by">' + U.esc(first.artist) + '</p><div class="row"><span class="meta">' + U.meta([first.cat, first.year, "26 canciones"]) + '</span><span class="cstar"><b>★ 4,6</b> <span>· 38 valoraciones</span></span></div></div></a>' +
      (pfOther.length ? '<p class="eds">Del mismo artista: ' + pfOther.map(function (a) { return "<a href=\"#\">" + U.esc(a.cat) + " de " + a.year + "</a>"; }).join(", ") + "</p>" : "") + "</div>" +
      others.map(function (a) {
        // Con el título idéntico a la consulta, lo que distingue es el artista: va primero.
        return '<a class="acard" href="#">' + U.cover(a.cover) + "<div><b>" + U.esc(a.artist) + '</b><span class="meta">' + U.meta([a.cat, a.year]) + "</span></div></a>";
      }).join("") +
      '</div><div class="loadmore"><button class="btn line">Cargar más</button></div></section>'
    );
  }

  function songs() {
    var s = D.songs[0];
    var covers = ["b1392450-e666-3926-a536-22c65f834433"];
    return (
      '<section class="block" aria-labelledby="b1"><h2 id="b1" class="sr-only">La canción</h2><article class="song-hero">' +
      "<div><h3>" + U.esc(s.title) + '</h3><p class="by">Radiohead</p><div class="row"><span class="meta">' + U.meta(["1992", "3:56", "aparece en " + s.albums.length + " discos"]) + '</span><span class="cstar"><b>★ 4,4</b> <span>· 61 valoraciones</span></span></div>' +
      '<div class="acts"><a class="btn primary" href="#">Ver la canción ' + I.arrow + '</a><a class="btn line" href="#">Ver a Radiohead</a></div></div>' +
      '<div class="appears">' + s.albums.slice(0, 7).map(function (a) {
        return '<a href="#">' + U.cover(a.cover) + "<div><b>" + U.esc(a.title) + '</b><span class="meta">' + U.meta([a.cat, a.year]) + "</span></div></a>";
      }).join("") + '<a href="#" class="more">+' + (s.albums.length - 7) + " discos</a></div></article></section>" +
      '<section class="block" aria-labelledby="b2"><div class="bh"><div><h2 id="b2">Otras canciones llamadas «Creep»</h2><p>Versiones de otros artistas y canciones distintas con el mismo título.</p></div><span class="see">' + (D.songs.length - 1) + " de " + U.countLabel(D.totals.song) + "</span></div>" +
      '<div class="sgrid">' + D.songs.slice(1).map(function (x) {
        return '<a class="scard" href="#">' + U.portrait({ name: x.artist }) + "<span><b>" + U.esc(x.artist) + '</b><span class="meta">' + U.esc(x.title) + "</span></span></a>";
      }).join("") + '</div><div class="loadmore"><button class="btn line">Cargar más</button></div></section>'
    );
  }

  function none() {
    var wall = [[24, "Kind of Blue", "Miles Davis"], [26, "Horses", "Patti Smith"], [6, "Madvillainy", "Madvillain"], [4, "Unknown Pleasures", "Joy Division"], [16, "LUX", "Rosalía"], [10, "Homogenic", "Björk"], [21, "London Calling", "The Clash"], [13, "Maggot Brain", "Funkadelic"]];
    return (
      '<section class="empty" aria-labelledby="eh"><div><h2 id="eh">Ningún álbum coincide con <q>qzxvbnmqk</q></h2>' +
      "<p>Tampoco hay artistas ni canciones con ese nombre, ni en el catálogo ni en MusicBrainz.</p>" +
      '<div class="tips"><p class="tip"><i>1</i><span>Revisa la ortografía o prueba con menos palabras.</span></p>' +
      '<p class="tip"><i>2</i><span>Para un disco concreto, escribe artista y título: <code>pink floyd - the wall</code>.</span></p>' +
      '<p class="tip"><i>3</i><span>Si sabes el año, el país o el sello, la <a href="#" style="color:var(--amber)">búsqueda avanzada</a> acota mejor.</span></p></div>' +
      '<div class="elsewhere"><span>Buscar en</span><a class="chip" href="#">' + I.artist + "Artistas</a><a class=\"chip\" href=\"#\">" + I.song + "Canciones</a><a class=\"chip\" href=\"#\">" + I.user + "Usuarios</a></div></div>" +
      '<div class="bigdisc">' + U.DISC + "</div></section>" +
      '<section class="mean" aria-labelledby="mh"><div class="bh"><div><h2 id="mh">Mientras tanto, discos para empezar</h2></div><a class="see" href="#">Ir a Explorar ' + "→</a></div>" +
      '<div class="wallrow">' + wall.map(function (w) { return '<a href="#"><i class="cv" data-c="' + w[0] + '"></i><div><b>' + w[1] + '</b><span class="meta">' + w[2] + "</span></div></a>"; }).join("") + "</div></section>"
    );
  }

  function render() {
    var st = window.currentState();
    window.paintHeader(QUERIES[st]);
    document.title = (st === "none" ? "Sin resultados" : "«" + QUERIES[st] + "»") + " · A · Rejilla";
    document.getElementById("app").innerHTML = head(st) + ({ artist: artists, album: albums, song: songs, none: none }[st])();
    if (window.paintCovers) window.paintCovers();
    window.scrollTo(0, 0);
  }
  window.paintCovers = function () {
    document.querySelectorAll("[data-c]").forEach(function (el) {
      var i = +el.dataset.c;
      el.style.backgroundImage = "url(wall.webp)"; el.style.backgroundSize = "800% 400%";
      el.style.backgroundPosition = ((i % 8) * 100) / 7 + "% " + (Math.floor(i / 8) * 100) / 3 + "%";
    });
  };
